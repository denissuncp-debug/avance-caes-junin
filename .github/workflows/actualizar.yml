name: Actualizacion Cada 2 Horas SIGO PAE
on:
  schedule:
    # Se ejecuta al minuto 0 de cada 2 horas (00:00, 02:00, 04:00, 06:00, etc., en horario UTC)
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: windows-latest
    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          pip install pandas openpyxl playwright
          playwright install chromium

      - name: Ejecutar robot extractor SIGO
        env:
          CLAVE_SIGO: ${{ secrets.CLAVE_SIGO }}
        run: python automatizador_sigo_pae_junin.py

      - name: Subir cambios actualizados a la web
        run: |
          git config --global user.name "Bot PAE Junin"
          git config --global user.email "bot@paejunin.pe"
          git add index.html
          git commit -m "Actualizacion automatica cada 2 horas desde SIGO" || exit 0
          git push
